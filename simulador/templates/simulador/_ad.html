{% if client and slot %}
<aside class="ad ad--{{ formato }}" aria-label="Publicidade">
  <span class="ad__rotulo">Publicidade</span>
  <ins class="adsbygoogle" style="display:block" data-ad-client="{{ client }}" data-ad-slot="{{ slot }}" data-ad-format="auto" data-full-width-responsive="true"></ins>
</aside>
{% elif debug %}
<aside class="ad ad--{{ formato }} ad--vazio" aria-hidden="true">Espaço de anúncio: {{ nome }}</aside>
{% endif %}
